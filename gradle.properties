# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.lang.invoke=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED

# JVM arguments for Kotlin compile daemon
kotlin.daemon.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Disable configuration cache to prevent Kotlin daemon communication timeouts
org.gradle.configuration-cache=false

# Kotlin code style for this project:
kotlin.code.style=official